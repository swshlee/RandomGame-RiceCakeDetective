<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>떡먹은 긍정이 찾기</title>
    <link rel="stylesheet" href="styles.css?v=answer-motion16" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="게임 설정">
        <header class="brand">
          <p>Positive Eating Ricecake Yabawi</p>
          <h1>떡먹은 긍정이 찾기</h1>
        </header>

        <div class="difficulty-field">
          <span>난이도</span>
          <div class="difficulty-select" role="group" aria-label="난이도 선택">
            <button type="button" data-difficulty="easy" aria-pressed="false">
              <span>Easy</span>
              <strong>3명</strong>
            </button>
            <button type="button" data-difficulty="normal" aria-pressed="true">
              <span>Normal</span>
              <strong>5명</strong>
            </button>
            <button type="button" data-difficulty="hard" aria-pressed="false">
              <span>Hard</span>
              <strong>7명</strong>
            </button>
          </div>
        </div>

        <div class="stats">
          <div>
            <span>캐릭터</span>
            <strong id="characterTotal">0</strong>
          </div>
        </div>

        <label id="guessPanel" class="guess-field" hidden>
          <span>정답 위치 입력</span>
          <input
            id="positionGuess"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="2"
            autocomplete="off"
            placeholder="1~5"
          />
        </label>

        <div class="actions">
          <button id="startButton" class="primary-button" type="button">게임시작</button>
          <button id="resetButton" class="ghost-button" type="button">초기화</button>
        </div>

        <p id="message" class="message">난이도와 정답 위치를 정하고 게임을 시작하세요.</p>
      </section>

      <section class="stage-panel" aria-label="떡 야바위 무대">
        <div class="stage-top">
          <div>
            <p>떡 먹은 긍정이가 마지막에 선 위치를 따라가세요.</p>
            <h2 id="stageTitle">대기 중</h2>
          </div>
          <span id="stageBadge">READY</span>
        </div>

        <div class="stage-action-bar" aria-live="polite">
          <button id="revealButton" class="primary-button reveal-button stage-action-button" type="button" hidden>
            결과 공개
          </button>
          <button id="playAgainButton" class="primary-button replay-button stage-action-button" type="button" hidden>
            다시하기
          </button>
        </div>

        <div id="arena" class="arena" aria-live="polite">
          <div class="table-line"></div>
          <div id="effectLayer" class="effect-layer"></div>
          <div id="board" class="board"></div>
        </div>

        <div class="winner-panel" id="winnerPanel" hidden>
          <span>떡 먹은 긍정이의 마지막 위치</span>
          <strong id="winnerName">--</strong>
          <p>왼쪽부터 센 위치입니다.</p>
        </div>
      </section>
    </main>

    <script src="app.js?v=answer-motion16"></script>
  </body>
</html>
