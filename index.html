<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>떡먹은 사람 찾기</title>
    <link rel="stylesheet" href="styles.css?v=sprites1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="게임 설정">
        <header class="brand">
          <p>Rice Cake Yabawi Console</p>
          <h1>떡먹은 사람 찾기</h1>
        </header>

        <label class="count-input">
          <span>야바위할 캐릭터 수</span>
          <input id="characterCount" type="number" min="3" max="12" value="8" inputmode="numeric" />
        </label>

        <div class="quick-counts" aria-label="빠른 캐릭터 수 선택">
          <button type="button" data-count="4">4명</button>
          <button type="button" data-count="6">6명</button>
          <button type="button" data-count="8">8명</button>
          <button type="button" data-count="10">10명</button>
        </div>

        <div class="stats">
          <div>
            <span>캐릭터</span>
            <strong id="characterTotal">0</strong>
          </div>
          <div>
            <span>섞기</span>
            <strong><span id="shuffleCounter">0</span>/5</strong>
          </div>
        </div>

        <div class="actions">
          <button id="startButton" class="primary-button" type="button">게임시작</button>
          <button id="revealButton" class="primary-button reveal-button" type="button" hidden>결과 확인</button>
          <button id="resetButton" class="ghost-button" type="button">초기화</button>
        </div>

        <p id="message" class="message">캐릭터 수를 정하고 게임을 시작하세요.</p>
      </section>

      <section class="stage-panel" aria-label="떡 야바위 무대">
        <div class="stage-top">
          <div>
            <p>한 캐릭터가 스스로 떡을 먹고, 모두가 일렬로 뒤섞입니다.</p>
            <h2 id="stageTitle">대기 중</h2>
          </div>
          <span id="stageBadge">READY</span>
        </div>

        <div id="arena" class="arena" aria-live="polite">
          <div class="table-line"></div>
          <div id="effectLayer" class="effect-layer"></div>
          <div id="board" class="board"></div>
        </div>

        <div class="winner-panel" id="winnerPanel" hidden>
          <span>떡 먹은 캐릭터</span>
          <strong id="winnerName">--</strong>
          <p>증거 떡이 여기서 나왔습니다.</p>
        </div>
      </section>
    </main>

    <script src="app.js?v=sprites1"></script>
  </body>
</html>
