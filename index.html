<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>떡먹은 사람 찾기</title>
    <link rel="stylesheet" href="styles.css?v=difficulty1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="게임 설정">
        <header class="brand">
          <p>Rice Cake Yabawi Console</p>
          <h1>떡먹은 사람 찾기</h1>
        </header>

        <div class="difficulty-field">
          <span>난이도</span>
          <div class="difficulty-select" role="group" aria-label="난이도 선택">
            <button type="button" data-difficulty="easy" aria-pressed="false">
              <span>Easy</span>
              <strong>3명</strong>
            </button>
            <button type="button" data-difficulty="normal" aria-pressed="true">
              <span>Normal</span>
              <strong>5명</strong>
            </button>
            <button type="button" data-difficulty="hard" aria-pressed="false">
              <span>Hard</span>
              <strong>7명</strong>
            </button>
          </div>
        </div>

        <div class="stats">
          <div>
            <span>캐릭터</span>
            <strong id="characterTotal">0</strong>
          </div>
          <div>
            <span>섞기</span>
            <strong><span id="shuffleCounter">0</span>/5</strong>
          </div>
        </div>

        <div class="actions">
          <button id="startButton" class="primary-button" type="button">게임시작</button>
          <button id="revealButton" class="primary-button reveal-button" type="button" hidden>결과 확인</button>
          <button id="resetButton" class="ghost-button" type="button">초기화</button>
        </div>

        <p id="message" class="message">난이도를 정하고 게임을 시작하세요.</p>
      </section>

      <section class="stage-panel" aria-label="떡 야바위 무대">
        <div class="stage-top">
          <div>
            <p>한 캐릭터가 스스로 떡을 먹고, 모두가 일렬로 뒤섞입니다.</p>
            <h2 id="stageTitle">대기 중</h2>
          </div>
          <span id="stageBadge">READY</span>
        </div>

        <div id="arena" class="arena" aria-live="polite">
          <div class="table-line"></div>
          <div id="effectLayer" class="effect-layer"></div>
          <div id="board" class="board"></div>
        </div>

        <div class="winner-panel" id="winnerPanel" hidden>
          <span>떡 먹은 캐릭터</span>
          <strong id="winnerName">--</strong>
          <p>증거 떡이 여기서 나왔습니다.</p>
        </div>
      </section>
    </main>

    <script src="app.js?v=difficulty1"></script>
  </body>
</html>
